plugins { id 'com.android.application' }
android {
    namespace 'com.kotobalock'
    compileSdk 36
    defaultConfig {
        applicationId 'com.kotobalock'
        minSdk 29
        targetSdk 36
        versionCode 11
        versionName '1.10'
    }
    buildTypes {
        // Debug-signed release so the APK installs directly without a keystore setup.
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
